name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.26

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Tagged releases are signed with the code signing certificate, through
      # SSL.com's eSigner; see build/windows/sign.ps1. Each signing counts
      # against the eSigner plan, so other builds aren't. The account's
      # secrets only reach the steps that sign, and only when this is true.
      # A fork's tags build unsigned: it has no eSigner account.
      SIGN: ${{ github.ref_type == 'tag' && github.repository == 'diablo2org/launcher' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Covers the spec: schemas, examples, every listing entry in servers/
      # and that servers/index.json is up to date; and the build tools.
      - name: Go tests
        run: go test ./internal/... ./build/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/... ./build/...

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        run: |
          wails3 generate bindings -clean=true -ts
          cd frontend
          npm run check

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # A per-user installer, so installing needs no administrator rights.
      # Tagged builds carry the tag as their version; others report "dev".
      # The tag reaches the script as an environment variable, never as
      # script text, so a tag name can't add commands; the Taskfile then
      # only uses it if it is a SemVer tag.
      # When signing, NSIS signs the launcher, its uninstaller and the
      # installer as it builds them (build/windows/nsis/project.nsi).
      - name: Build installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          LAUNCHER_SIGN: ${{ env.SIGN }}
          ES_USERNAME: ${{ env.SIGN == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ env.SIGN == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ env.SIGN == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ env.SIGN == 'true' && secrets.ES_TOTP_SECRET || '' }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { "" }
          if ($version) { wails3 package INSTALL_SCOPE=user VERSION=$version } else { wails3 package INSTALL_SCOPE=user }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: d2pack for server teams
        run: go build -trimpath -ldflags "-s -w" -o bin/d2pack.exe ./cmd/d2pack

      - name: Sign d2pack
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: ./build/windows/sign.ps1 bin/d2pack.exe

      # A release must never go out unsigned, or signed by anyone else: check
      # what was built rather than trusting each signing step.
      - name: Check signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item bin/launcher.exe, bin/d2pack.exe) + @(Get-ChildItem bin/*-installer.exe) + @(Get-ChildItem bin/legacy-dl/windows-*/blizzard-legacy-dl.exe)
          $subject = $null
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid" -or -not $sig.TimeStamperCertificate) {
              throw "$($f.Name): signature $($sig.Status)$(if (-not $sig.TimeStamperCertificate) { ', no timestamp' })"
            }
            if ($subject -and $sig.SignerCertificate.Subject -ne $subject) {
              throw "$($f.Name) is signed by $($sig.SignerCertificate.Subject), the others by $subject"
            }
            $subject = $sig.SignerCertificate.Subject
            "{0}: signed by {1}, timestamped {2}" -f $f.Name, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
          }

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-Item bin/launcher.exe, bin/d2pack.exe) + @(Get-ChildItem bin/*-installer.exe)
          if ($files.Count -lt 3) { throw "the installer is missing from bin/" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii bin/SHA256SUMS.txt
          Get-Content bin/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            bin/launcher.exe
            bin/d2pack.exe
            bin/SHA256SUMS.txt
            bin/*-installer.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      # Tagged releases are signed with the Developer ID certificate and
      # notarized; see build/darwin/sign.sh. As on Windows, the secrets only
      # reach the steps that sign, and a fork's tags build unsigned.
      SIGN: ${{ github.ref_type == 'tag' && github.repository == 'diablo2org/launcher' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Go tests
        run: go test ./internal/... ./build/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/... ./build/...

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        run: |
          wails3 generate bindings -clean=true -ts
          cd frontend
          npm run check

      # A universal app (arm64 and amd64) with a universal blizzard-legacy-dl
      # inside. The tag reaches the build as an environment variable, never
      # as script text; the Taskfile only uses a SemVer tag.
      - name: Build app
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=""
          if [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; fi
          wails3 task darwin:package:universal VERSION="$version"
          if [ -n "$version" ]; then
            numeric=$(printf '%s' "${version#v}" | sed -E 's/[-+].*$//')
            plutil -replace CFBundleShortVersionString -string "$numeric" bin/launcher.app/Contents/Info.plist
            plutil -replace CFBundleVersion -string "$numeric" bin/launcher.app/Contents/Info.plist
          fi
          lipo -info bin/launcher.app/Contents/MacOS/launcher
          lipo -info bin/launcher.app/Contents/Resources/bin/blizzard-legacy-dl

      - name: Sign app
        if: env.SIGN == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: build/darwin/sign.sh app bin/launcher.app

      - name: Build DMG
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          wails3 task darwin:create:dmg
          name="launcher-dev-universal.dmg"
          if [ "$REF_TYPE" = "tag" ]; then name="launcher-${REF_NAME}-universal.dmg"; fi
          mv bin/launcher.dmg "bin/$name"
          ls -l bin/*.dmg

      - name: Sign and notarize DMG
        if: env.SIGN == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: build/darwin/sign.sh dmg bin/launcher-*-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: bin/launcher-*-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # GTK 4 and WebKitGTK 6.0, which the Linux build links against, and
      # FUSE for running the AppImage tooling.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64 file

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Go tests
        run: go test ./internal/... ./build/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/... ./build/...

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        run: |
          wails3 generate bindings -clean=true -ts
          cd frontend
          npm run check

      # The AppImage is the main Linux download, with blizzard-legacy-dl
      # inside; deb and rpm are built from the same binary.
      - name: Build packages
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=""
          if [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; fi
          if [ -n "$version" ]; then
            numeric=$(printf '%s' "${version#v}" | sed -E 's/[-+].*$//')
            sed -i -E "s/^version: .*/version: \"$numeric\"/" build/linux/nfpm/nfpm.yaml
          fi
          wails3 task linux:build VERSION="$version"
          wails3 task linux:create:appimage VERSION="$version"
          wails3 task linux:create:deb VERSION="$version"
          wails3 task linux:create:rpm VERSION="$version"
          name="${version:-dev}"
          mv bin/launcher-x86_64.AppImage "bin/launcher-${name}-x86_64.AppImage"
          ls -l bin

      # The AppImage starts, and holds blizzard-legacy-dl beside the launcher.
      - name: Check AppImage
        run: |
          image=$(ls bin/launcher-*-x86_64.AppImage)
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/launcher
          test -x squashfs-root/usr/bin/blizzard-legacy-dl
          file squashfs-root/usr/bin/blizzard-legacy-dl

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: |
            bin/launcher-*-x86_64.AppImage
            bin/*.deb
            bin/*.rpm
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # One checksums file for every release file, so each package can be
      # checked the same way, and the launcher finds its installer's hash.
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*-installer.exe' -o -name 'd2pack.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sha256sum {} + | sed -E 's#  .*/#  #' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A tag with a suffix, such as v1.2.3-rc.1, is a pre-release: the
      # launcher's update check skips those, so test builds never reach
      # players.
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*-installer.exe
            dist/**/d2pack.exe
            dist/**/launcher-*-universal.dmg
            dist/**/launcher-*-x86_64.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/SHA256SUMS.txt
          generate_release_notes: true
