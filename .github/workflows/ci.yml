name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.26

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Tagged releases are signed with the code signing certificate, through
      # SSL.com's eSigner; see build/windows/sign.ps1. Each signing counts
      # against the eSigner plan, so other builds aren't. The account's
      # secrets only reach the steps that sign, and only when this is true.
      # A fork's tags build unsigned: it has no eSigner account.
      SIGN: ${{ github.ref_type == 'tag' && github.repository == 'diablo2org/launcher' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Covers the spec: schemas, examples, every listing entry in servers/
      # and that servers/index.json is up to date; and the build tools.
      - name: Go tests
        run: go test ./internal/... ./build/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/... ./build/...

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        run: |
          wails3 generate bindings -clean=true -ts
          cd frontend
          npm run check

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # A per-user installer, so installing needs no administrator rights.
      # Tagged builds carry the tag as their version; others report "dev".
      # The tag reaches the script as an environment variable, never as
      # script text, so a tag name can't add commands; the Taskfile then
      # only uses it if it is a SemVer tag.
      # When signing, NSIS signs the launcher, its uninstaller and the
      # installer as it builds them (build/windows/nsis/project.nsi).
      - name: Build installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          LAUNCHER_SIGN: ${{ env.SIGN }}
          ES_USERNAME: ${{ env.SIGN == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ env.SIGN == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ env.SIGN == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ env.SIGN == 'true' && secrets.ES_TOTP_SECRET || '' }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { "" }
          if ($version) { wails3 package INSTALL_SCOPE=user VERSION=$version } else { wails3 package INSTALL_SCOPE=user }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: d2pack for server teams
        run: go build -trimpath -ldflags "-s -w" -o bin/d2pack.exe ./cmd/d2pack

      - name: Sign d2pack
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: ./build/windows/sign.ps1 bin/d2pack.exe

      # A release must never go out unsigned, or signed by anyone else: check
      # what was built rather than trusting each signing step.
      - name: Check signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item bin/launcher.exe, bin/d2pack.exe) + @(Get-ChildItem bin/*-installer.exe) + @(Get-ChildItem bin/legacy-dl/windows-*/blizzard-legacy-dl.exe)
          $subject = $null
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne "Valid" -or -not $sig.TimeStamperCertificate) {
              throw "$($f.Name): signature $($sig.Status)$(if (-not $sig.TimeStamperCertificate) { ', no timestamp' })"
            }
            if ($subject -and $sig.SignerCertificate.Subject -ne $subject) {
              throw "$($f.Name) is signed by $($sig.SignerCertificate.Subject), the others by $subject"
            }
            $subject = $sig.SignerCertificate.Subject
            "{0}: signed by {1}, timestamped {2}" -f $f.Name, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
          }

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-Item bin/launcher.exe, bin/d2pack.exe) + @(Get-ChildItem bin/*-installer.exe)
          if ($files.Count -lt 3) { throw "the installer is missing from bin/" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii bin/SHA256SUMS.txt
          Get-Content bin/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            bin/launcher.exe
            bin/d2pack.exe
            bin/SHA256SUMS.txt
            bin/*-installer.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: dist

      # A tag with a suffix, such as v1.2.3-rc.1, is a pre-release: the
      # launcher's update check skips those, so test builds never reach
      # players.
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*-installer.exe
            dist/**/d2pack.exe
            dist/**/SHA256SUMS.txt
          generate_release_notes: true
